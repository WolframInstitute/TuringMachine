[package]
name = "ndtm_search"
version = "0.1.0"
edition = "2024"

[dependencies]
bit-vec = "0.6"
num-bigint = "0.4"
clap = { version = "4.5.4", features = ["derive"] }
# Pinned to a known-good feature/wxf commit (0.6.0-alpha.4) rather than the bare
# branch, since this is pre-release and has broken before. cadc9fb includes the
# fix for the standalone build break (wolfram-library-link now declares its
# wolfram-serialize dep) and the cross-compilation fixes.
wolfram-library-link = { git = "https://github.com/WolframResearch/wolfram-rust-library", rev = "cadc9fb559c92a74e4624e3a90e852b3b040f79c" }
wolfram-serialize = { git = "https://github.com/WolframResearch/wolfram-rust-library", rev = "cadc9fb559c92a74e4624e3a90e852b3b040f79c" }
num-traits = "0.2.19"
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"

[lib]
name = "ndtm_search"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"