[package]
name = "ndtm_search"
version = "0.1.0"
edition = "2024"

# `cargo wl build` (cargo-wl, from WolframResearch/wolfram-rust-library)
# compiles the cdylib, reads the function manifest the #[export] macro embeds
# in it, and writes the binary plus a generated Functions.wl loader into
# <paclet>/Binaries/ndtm_search-<SystemID>/. The kernel Gets that Functions.wl
# to obtain <|"name" -> function, ...|>.
[package.metadata.wl.pacletinfo]
name = "ndtm_search"
output = "../../Binaries"
named-exports = true

[dependencies]
bit-vec = "0.6"
num-bigint = "0.4"
clap = { version = "4.5.4", features = ["derive"] }
wolfram-export = { version = "0.6.1", features = ["wxf"] }
wolfram-expr = "0.6"
# Direct dep only for wolfram_library_link::aborted() (kernel-abort checks in
# the long-running searches). default-features off keeps the WSTP C++ stack
# (link-cplusplus) out, which would not cross-compile to macOS under Zig.
wolfram-library-link = { version = "0.6.1", default-features = false }
num-traits = "0.2.19"
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"

[lib]
name = "ndtm_search"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"
