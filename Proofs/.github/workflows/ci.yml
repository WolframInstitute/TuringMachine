# CI for the Lean development.
#
# This file lives under Proofs/.github/ and is therefore inert while the Lake
# project sits inside the paclet repository (GitHub reads workflows from the
# repository root only). It is written for the split repository of
# docs/PUBLISHING.md section 2; to run it in-tree, move it to
# .github/workflows/ at the repository root and keep `working-directory: Proofs`.

name: lean

on:
  push:
    branches: [main, lean-proofs]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Proofs
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: No sorry, no native_decide outside Tests/
        run: |
          set -e
          if grep -rn --include='*.lean' -E '\bsorry\b' Smith TagSystem BiTM TM | grep -v '^\S*:\s*--' ; then
            echo "sorry found in the proof modules"; exit 1
          fi
          if grep -rn --include='*.lean' 'native_decide' Smith TagSystem BiTM TM ; then
            echo "native_decide found outside Tests/"; exit 1
          fi

      - name: Axiom check of the headline theorems
        run: |
          cat > /tmp/ax.lean <<'EOF'
          import Smith.Infinite
          #print axioms Smith.wolfram23_universal
          #print axioms Smith.wolfram23_infinite
          EOF
          lake env lean /tmp/ax.lean | tee /tmp/ax.out
          test "$(grep -c "depends on axioms: \[propext, Classical.choice, Quot.sound\]" /tmp/ax.out)" = 2
